function submitFinance() {
  var amount = parseFloat(document.getElementById('fin-amount').value);
  if (isNaN(amount) || amount <= 0) { showToast('请输入有效金额', 'warning'); return; }
  var rec = {
    id: editingFinanceId || generateId(),
    type: financeType,
    date: document.getElementById('fin-date').value || todayStr(),
    category: document.getElementById('fin-cat').value,
    amount: amount,
    note: document.getElementById('fin-note').value.trim()
  };
  if (editingFinanceId) {
    var idx = finance.findIndex(function(r) { return r.id === editingFinanceId; });
    if (idx >= 0) finance[idx] = rec;
  } else {
    finance.push(rec);
  }
  saveData(userKey(BASE_KEYS.finance), finance);
  financeMonth = rec.date.slice(0, 7);
  updateFinanceMonthLabel();
  clearFinanceForm();
  renderFinance();
  updateDataCount();
  checkBackupReminder();
  showToast(editingFinanceId ? '已更新' : '已添加', 'success');
}

function editFinance(id) {
  var rec = finance.find(function(r) { return r.id === id; });
  if (!rec) return;
  editingFinanceId = id;
  financeType = rec.type;
  setFinanceType(rec.type);
  document.getElementById('fin-date').value = rec.date;
  setTimeout(function() {
    document.getElementById('fin-cat').value = rec.category;
  }, 10);
  document.getElementById('fin-amount').value = rec.amount;
  document.getElementById('fin-note').value = rec.note;
  document.getElementById('fin-submit-btn').innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> 更新';
  document.getElementById('fin-cancel-btn').style.display = '';
  document.getElementById('finance-edit-hint').textContent = '正在编辑';
}

function cancelEditFinance() {
  editingFinanceId = null;
  clearFinanceForm();
  document.getElementById('fin-submit-btn').innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> 添加';
  document.getElementById('fin-cancel-btn').style.display = 'none';
  document.getElementById('finance-edit-hint').textContent = '';
}

function clearFinanceForm() {
  editingFinanceId = null;
  document.getElementById('fin-date').value = todayStr();
  document.getElementById('fin-amount').value = '';
  document.getElementById('fin-note').value = '';
  document.getElementById('fin-submit-btn').innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> 添加';
  document.getElementById('fin-cancel-btn').style.display = 'none';
  document.getElementById('finance-edit-hint').textContent = '';
}

function deleteFinance(id) {
  if (editingFinanceId === id) cancelEditFinance();
  finance = finance.filter(function(r) { return r.id !== id; });
  saveData(userKey(BASE_KEYS.finance), finance);
  renderFinance();
  updateDataCount();
  checkBackupReminder();
}

var PIE_COLORS = ['#E8746C','#6B8AAD','#8BC48A','#F0B86E','#B07DB8','#5CC5C5','#E8A0BF','#A0C4E8'];

// ===== 记账月份过滤 =====
function curMonthKey() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function monthLabelOf(ym) {
  var parts = ym.split('-');
  return parts[0] + '年' + parseInt(parts[1], 10) + '月';
}
function getMonthFinance() {
  return finance.filter(function(r) { return (r.date || '').slice(0, 7) === financeMonth; });
}
function updateFinanceMonthLabel() {
  var el = document.getElementById('finance-month-label');
  if (el) {
    el.textContent = monthLabelOf(financeMonth) + (financeMonth === curMonthKey() ? '（本月）' : '');
  }
}
function changeFinanceMonth(dir) {
  var parts = financeMonth.split('-');
  var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10) + dir;
  if (m < 1) { m = 12; y--; }
  if (m > 12) { m = 1; y++; }
  financeMonth = y + '-' + String(m).padStart(2, '0');
  updateFinanceMonthLabel();
  renderFinance();
}
function goFinanceThisMonth() {
  financeMonth = curMonthKey();
  updateFinanceMonthLabel();
  renderFinance();
}

function renderPieChart() {
  var wrap = document.getElementById('pie-chart-top');
  if (!wrap) return;
  // 按支出分类汇总
  var catTotals = {};
  var totalExpense = 0;
  getMonthFinance().forEach(function(r) {
    if (r.type === 'expense') {
      catTotals[r.category] = (catTotals[r.category] || 0) + r.amount;
      totalExpense += r.amount;
    }
  });
  var entries = [];
  for (var cat in catTotals) {
    entries.push({ cat: cat, amount: catTotals[cat] });
  }
  entries.sort(function(a, b) { return b.amount - a.amount; });

  if (entries.length === 0) {
    wrap.innerHTML = '<div class="list-empty" style="padding:20px 0">暂无支出记录</div>';
    return;
  }

  // 窄屏下用更大的饼图和横向布局
  var isNarrow = window.innerWidth <= 768;
  var size = isNarrow ? 220 : 180;
  var cx = size / 2, cy = size / 2, r = size / 2 - 10;
  var innerR = isNarrow ? 55 : 45;

  var svg = '<svg viewBox="0 0 ' + size + ' ' + size + '" xmlns="http://www.w3.org/2000/svg" style="width:' + (isNarrow ? '160px' : 'auto') + ';height:auto">';
  var startAngle = -Math.PI / 2;
  entries.forEach(function(e, i) {
    var fraction = e.amount / totalExpense;
    var angle = fraction * 2 * Math.PI;
    var endAngle = startAngle + angle;
    var largeArc = angle > Math.PI ? 1 : 0;
    var x1 = cx + r * Math.cos(startAngle);
    var y1 = cy + r * Math.sin(startAngle);
    var x2 = cx + r * Math.cos(endAngle);
    var y2 = cy + r * Math.sin(endAngle);
    var color = PIE_COLORS[i % PIE_COLORS.length];
    if (fraction >= 0.999) {
      svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + color + '"/>';
    } else {
      svg += '<path d="M' + cx + ',' + cy + ' L' + x1.toFixed(2) + ',' + y1.toFixed(2) + ' A' + r + ',' + r + ' 0 ' + largeArc + ',1 ' + x2.toFixed(2) + ',' + y2.toFixed(2) + ' Z" fill="' + color + '"/>';
    }
    startAngle = endAngle;
  });
  // 中心白色圆（甜甜圈效果）
  svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + innerR + '" fill="white"/>';
  svg += '<text x="' + cx + '" y="' + (cy - 6) + '" text-anchor="middle" font-size="' + (isNarrow ? 14 : 12) + '" fill="#8A9BA8">总支出</text>';
  svg += '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" font-size="' + (isNarrow ? 16 : 14) + '" fill="#E8746C" font-weight="700">¥' + totalExpense.toFixed(0) + '</text>';
  svg += '</svg>';

  // 图例
  var legend = '<div class="pie-legend">';
  entries.forEach(function(e, i) {
    var pct = ((e.amount / totalExpense) * 100).toFixed(1);
    var color = PIE_COLORS[i % PIE_COLORS.length];
    legend += '<span class="pie-legend-item"><span class="pie-legend-dot" style="background:' + color + '"></span>' + e.cat + ' ¥' + e.amount.toFixed(0) + ' (' + pct + '%)</span>';
  });
  legend += '</div>';

  wrap.innerHTML = svg + legend;
}

function renderHBarChart() {
  var wrap = document.getElementById('hbar-chart');
  if (!wrap) return;

  // 计算收支对比
  var totalExpense = 0, totalIncome = 0;
  getMonthFinance().forEach(function(r) {
    if (r.type === 'expense') totalExpense += r.amount;
    else totalIncome += r.amount;
  });
  var balance = totalIncome - totalExpense;

  // 收支对比卡片（紧凑三栏）
  var html = '<div class="income-expense-summary">';
  html += '<div class="ie-box"><div class="ie-label">支出</div><div class="ie-amount expense">¥' + totalExpense.toFixed(2) + '</div></div>';
  html += '<div class="ie-box"><div class="ie-label">收入</div><div class="ie-amount income">¥' + totalIncome.toFixed(2) + '</div></div>';
  html += '<div class="ie-box"><div class="ie-label">结余</div><div class="ie-amount balance' + (balance < 0 ? ' negative' : '') + '">' + (balance >= 0 ? '+' : '') + '¥' + balance.toFixed(2) + '</div></div>';
  html += '</div>';

  // 按支出分类汇总
  var catTotals = {};
  getMonthFinance().forEach(function(r) {
    if (r.type === 'expense') {
      catTotals[r.category] = (catTotals[r.category] || 0) + r.amount;
    }
  });
  var entries = [];
  for (var cat in catTotals) {
    entries.push({ cat: cat, amount: catTotals[cat] });
  }
  entries.sort(function(a, b) { return b.amount - a.amount; });

  if (entries.length === 0) {
    html += '<div class="list-empty" style="padding:10px 0;font-size:13px">暂无支出</div>';
    wrap.innerHTML = html;
    return;
  }

  var maxAmount = 0;
  entries.forEach(function(e) { if (e.amount > maxAmount) maxAmount = e.amount; });

  // SVG 使用 viewBox 100% 宽度自适应容器
  var barH = 18, gap = 10, left = 50, right = 60, top = 8;
  var chartW = 260, chartH = top + entries.length * (barH + gap) - gap + 8;

  var svg = '<svg viewBox="0 0 ' + chartW + ' ' + chartH + '" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
  entries.forEach(function(e, i) {
    var y = top + i * (barH + gap);
    var bw = maxAmount > 0 ? (e.amount / maxAmount) * (chartW - left - right) : 0;
    if (bw < 3 && e.amount > 0) bw = 3;
    var color = PIE_COLORS[i % PIE_COLORS.length];
    svg += '<text x="' + (left - 6) + '" y="' + (y + barH / 2 + 4) + '" text-anchor="end" font-size="12" fill="#8A9BA8">' + e.cat + '</text>';
    svg += '<rect x="' + left + '" y="' + y + '" width="' + bw + '" height="' + barH + '" rx="4" fill="' + color + '"/>';
    svg += '<text x="' + (left + bw + 6) + '" y="' + (y + barH / 2 + 4) + '" font-size="11" fill="#E8746C" font-weight="600">¥' + e.amount.toFixed(0) + '</text>';
  });
  svg += '</svg>';
  html += svg;
  wrap.innerHTML = html;
}

function renderFinance() {
  updateFinanceMonthLabel();
  var list = document.getElementById('finance-list');
  var monthRecs = getMonthFinance();
  if (monthRecs.length === 0) {
    list.innerHTML = '<div class="list-empty">' + monthLabelOf(financeMonth) + ' 还没有记账记录</div>';
  } else {
    var sorted = monthRecs.slice().sort(function(a, b) { return b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1); });
    var html = '';
    sorted.forEach(function(r) {
      var isExp = r.type === 'expense';
      html += '<div class="finance-record">';
      html += '<span class="rec-date">' + r.date + '</span>';
      html += '<span class="rec-cat ' + r.type + '">' + escapeHtml(r.category) + '</span>';
      html += '<span class="rec-note">' + (r.note ? escapeHtml(r.note) : '') + '</span>';
      html += '<span class="record-amount ' + r.type + '">' + (isExp ? '-' : '+') + '¥' + r.amount.toFixed(2) + '</span>';
      html += '<div class="rec-actions">';
      html += '<button class="btn btn-sm btn-icon" onclick="editFinance(\'' + r.id + '\')" title="编辑" style="color:var(--primary)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>';
      html += '<button class="btn btn-sm btn-icon btn-danger" onclick="deleteFinance(\'' + r.id + '\')" title="删除" style="color:var(--warning)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>';
      html += '</div>';
      html += '</div>';
    });
    list.innerHTML = html;
  }
  renderPieChart();
  renderHBarChart();
}

// 旧版无用户数据迁移：注册第一个用户时，把旧 key（wb_yuanxutai_xxx）的数据迁到新用户
function migrateLegacyDataIfNeeded(newUsername) {
  if (localStorage.getItem(LEGACY_MIGRATED)) return;
  const legacyKeys = ['items', 'fridge', 'todos', 'shopping', 'finance', 'weekPlan', 'customRecipes'];
  let hasLegacy = false;
  legacyKeys.forEach(function(k) {
    if (localStorage.getItem(PREFIX + k) !== null) hasLegacy = true;
  });
  if (!hasLegacy) { localStorage.setItem(LEGACY_MIGRATED, '1'); return; }
  // 迁移到新用户
  legacyKeys.forEach(function(k) {
    const v = localStorage.getItem(PREFIX + k);
    if (v !== null) localStorage.setItem(PREFIX + newUsername + '_' + k, v);
  });
  // 标记该用户已初始化，避免被示例数据覆盖
  localStorage.setItem(PREFIX + newUsername + '_initialized', '1');
  // 旧 key 标记为已迁移，保留原值供其它用途
  localStorage.setItem(LEGACY_MIGRATED, '1');
}

  const users = getUsers();
  if (users.length === 0) {
    saveUsers([{ username: 'admin', password: '123456', role: 'admin', createdAt: new Date().toISOString() }]);
  }

  // 检查已有会话，自动登录
  const session = getSession();
  const u = users.find(function(x) { return x.username === session; });
