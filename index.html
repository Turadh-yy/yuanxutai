let CRC_TABLE = null;
function crc32(buf) {
  if (!CRC_TABLE) {
    CRC_TABLE = new Int32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      CRC_TABLE[i] = c;
    }
  }
  let crc = -1;
  for (let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ buf[i]) & 0xFF];
  return (crc ^ -1) >>> 0;
}

function textBytes(s) {
  return new TextEncoder().encode(s);
}

// zip 打包（STORE 无压缩）
function zipStore(entries) {
  const chunks = [];
  const central = [];
  let offset = 0;
  entries.forEach(function(e) {
    const nameB = textBytes(e.name);
    const dataB = e.data;
    const crc = crc32(dataB);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true);
    h.setUint16(4, 20, true);          // version
    h.setUint16(6, 0, true);           // flags
    h.setUint16(8, 0, true);           // method: store
    h.setUint16(10, 0, true);          // mod time
    h.setUint16(12, 0x21, true);       // mod date
    h.setUint32(14, crc, true);
    h.setUint32(18, dataB.length, true);
    h.setUint32(22, dataB.length, true);
    h.setUint16(26, nameB.length, true);
    h.setUint16(28, 0, true);          // extra len
    chunks.push(new Uint8Array(h.buffer), nameB, dataB);
    central.push({ nameB: nameB, crc: crc, size: dataB.length, offset: offset });
    offset += 30 + nameB.length + dataB.length;
  });
  // central directory
  const cdStart = offset;
  central.forEach(function(c) {
    const h = new DataView(new ArrayBuffer(46));
    h.setUint32(0, 0x02014b50, true);
    h.setUint16(4, 20, true);
    h.setUint16(6, 20, true);
    h.setUint16(8, 0, true);
    h.setUint16(10, 0, true);
    h.setUint16(12, 0, true);
    h.setUint16(14, 0x21, true);
    h.setUint32(16, c.crc, true);
    h.setUint32(20, c.size, true);
    h.setUint32(24, c.size, true);
    h.setUint16(28, c.nameB.length, true);
    h.setUint16(30, 0, true);          // extra
    h.setUint16(32, 0, true);          // comment
    h.setUint16(34, 0, true);          // disk
    h.setUint16(36, 0, true);          // int attrs
    h.setUint32(38, 0, true);          // ext attrs
    h.setUint32(42, c.offset, true);
    chunks.push(new Uint8Array(h.buffer), c.nameB);
    offset += 46 + c.nameB.length;
  });
  const cdSize = offset - cdStart;
  // EOCD
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(4, 0, true);
  eo.setUint16(6, 0, true);
  eo.setUint16(8, central.length, true);
  eo.setUint16(10, central.length, true);
  eo.setUint32(12, cdSize, true);
  eo.setUint32(16, cdStart, true);
  eo.setUint16(20, 0, true);
  chunks.push(new Uint8Array(eo.buffer));
  const total = chunks.reduce(function(s, c) { return s + c.length; }, 0);
  const out = new Uint8Array(total);
  let p = 0;
  chunks.forEach(function(c) { out.set(c, p); p += c.length; });
  return out;
}

function xmlEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}

// 构建 sheet XML
function sheetXml(rows) {
  let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  xml += '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach(function(row, ri) {
    xml += '<row r="' + (ri + 1) + '">';
    row.forEach(function(cell, ci) {
      const ref = String.fromCharCode(65 + (ci % 26)) + (ri + 1);
      if (cell === null || cell === undefined || cell === '') {
        xml += '<c r="' + ref + '"/>';
      } else if (typeof cell === 'number') {
        xml += '<c r="' + ref + '" t="n"><v>' + cell + '</v></c>';
      } else if (typeof cell === 'boolean') {
        xml += '<c r="' + ref + '" t="b"><v>' + (cell ? 1 : 0) + '</v></c>';
      } else {
        xml += '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(String(cell)) + '</t></is></c>';
      }
    });
    xml += '</row>';
  });
  xml += '</sheetData></worksheet>';
  return xml;
}

// 构建 xlsx 文件
function buildXlsx(sheetMap, meta) {
  const sheetNames = Object.keys(sheetMap).filter(function(n) { return (sheetMap[n] || []).length > 0; });
  const files = [];
  const rels = [];
  const contentOverrides = [];
  files.push({ name: '[Content_Types].xml', data: textBytes(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    contentOverrides.join('') +
    '</Types>'
  ) });
  files.push({ name: '_rels/.rels', data: textBytes(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>'
  ) });
  const sheetsXml = [];
  sheetNames.forEach(function(name, i) {
    const sn = i + 1;
    const rows = sheetMap[name].map(function(obj) {
      return Object.keys(obj).map(function(k) { return obj[k]; });
    });
    // 首行表头
    const headers = sheetMap[name].length ? Object.keys(sheetMap[name][0]) : [];
    const allRows = headers.length ? [headers].concat(rows) : rows;
    files.push({ name: 'xl/worksheets/sheet' + sn + '.xml', data: textBytes(sheetXml(allRows)) });
    sheetsXml.push('<sheet name="' + xmlEsc(name) + '" sheetId="' + sn + '" r:id="rId' + sn + '"/>');
    rels.push('<Relationship Id="rId' + sn + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + sn + '.xml"/>');
    contentOverrides.push('<Override PartName="/xl/worksheets/sheet' + sn + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>');
  });
  files.push({ name: 'xl/workbook.xml', data: textBytes(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<sheets>' + sheetsXml.join('') + '</sheets></workbook>'
  ) });
  files.push({ name: 'xl/_rels/workbook.xml.rels', data: textBytes(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    rels.join('') + '</Relationships>'
  ) });
  return zipStore(files);
}

// 解析 zip：返回 {name -> Uint8Array}
function parseZip(data) {
  // 找 EOCD
  let eocd = -1;
  for (let i = data.length - 22; i >= 0; i--) {
    if (data[i] === 0x50 && data[i + 1] === 0x4b && data[i + 2] === 0x05 && data[i + 3] === 0x06) { eocd = i; break; }
  }
  if (eocd < 0) return null;
  const dv = new DataView(data.buffer, data.byteOffset, data.byteLength);
  const cdCount = dv.getUint16(eocd + 10, true);
  const cdOffset = dv.getUint32(eocd + 16, true);
  const out = {};
  let p = cdOffset;
  for (let i = 0; i < cdCount; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOffset = dv.getUint32(p + 42, true);
    const name = String.fromCharCode.apply(null, data.subarray(p + 46, p + 46 + nameLen));
    // 读 local header 定位数据
    const lv = new DataView(data.buffer, data.byteOffset + localOffset, 30);
    const lNameLen = lv.getUint16(26, true);
    const lExtraLen = lv.getUint16(28, true);
    const dataStart = localOffset + 30 + lNameLen + lExtraLen;
    let chunk = data.subarray(dataStart, dataStart + compSize);
    if (method === 8) chunk = { deflate: true, data: chunk }; // DEFLATE，稍后异步解压
    out[name] = chunk;
    p += 46 + nameLen + extraLen + commentLen;
  }
  return out;
}

async function inflateRaw(data) {
  try {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([data]).stream().pipeThrough(ds);
    const buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  } catch (e) {
    return null;
  }
}

// 解析 xlsx -> { sheets: { 表名: [对象数组] } }
async function parseXlsx(u8) {
  const zip = parseZip(u8);
  if (!zip) return null;
  // 解压 DEFLATE 条目
  for (const k of Object.keys(zip)) {
    if (zip[k] && zip[k].deflate) {
      const raw = await inflateRaw(zip[k].data);
      if (raw) zip[k] = raw; else return null;
    }
  }
  const wbXml = zip['xl/workbook.xml'];
  if (!wbXml) return null;
  const wbDoc = new DOMParser().parseFromString(new TextDecoder().decode(wbXml), 'application/xml');
  const sheetNodes = wbDoc.getElementsByTagName('sheet');
  const sheets = {};
  for (let i = 0; i < sheetNodes.length; i++) {
    const name = sheetNodes[i].getAttribute('name');
    const file = 'xl/worksheets/sheet' + (i + 1) + '.xml';
    if (!zip[file]) continue;
    const doc = new DOMParser().parseFromString(new TextDecoder().decode(zip[file]), 'application/xml');
    const rows = doc.getElementsByTagName('row');
    const table = [];
    let headers = null;
    for (let r = 0; r < rows.length; r++) {
      const cells = rows[r].getElementsByTagName('c');
      const rowArr = [];
      for (let c = 0; c < cells.length; c++) {
        const el = cells[c];
        const t = el.getAttribute('t');
        const vEl = el.getElementsByTagName('v')[0];
        const isEl = el.getElementsByTagName('is')[0];
        let val = '';
        if (t === 'n' && vEl) val = Number(vEl.textContent);
        else if (t === 'b' && vEl) val = vEl.textContent === '1';
        else if (isEl) val = isEl.getElementsByTagName('t')[0] ? isEl.getElementsByTagName('t')[0].textContent : '';
        else if (vEl) val = vEl.textContent;
        rowArr.push(val);
      }
      if (!headers) { headers = rowArr; }
      else {
        const obj = {};
        headers.forEach(function(h, idx) { obj[h] = rowArr[idx]; });
        table.push(obj);
      }
    }
    sheets[name] = table;
  }
  return { sheets: sheets };
}

function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show';
  if (type) toast.classList.add(type);
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 3000);
}

function showModal(title, msg, onConfirm) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-msg').textContent = msg;
  modalConfirmCallback = onConfirm;
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  modalConfirmCallback = null;
  const customActions = document.getElementById('modal-custom-actions');
  const defaultActions = document.getElementById('modal-default-actions');
  if (customActions) { customActions.style.display = 'none'; customActions.innerHTML = ''; }
  if (defaultActions) defaultActions.style.display = 'flex';
}

document.getElementById('modal-confirm-btn').addEventListener('click', function() {
  if (modalConfirmCallback) modalConfirmCallback();
  closeModal();
});

// ===== 存储读写 =====
function saveData(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify(data));
  } catch (e) {
    showToast('存储失败，数据可能过大', 'warning');
  }
}

function loadData(key, defaultVal) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : defaultVal;
  } catch (e) {
    return defaultVal;
  }
}

// ===== 物品管理 =====
function onCategoryChange() {
  var cat = document.getElementById('item-category').value;
  var catInfo = ITEM_CATEGORIES[cat];
  document.getElementById('item-cycle-wrap').style.display = catInfo.hasCycle ? 'flex' : 'none';
  if (catInfo.hasCycle && catInfo.defaultCycle > 0) {
    document.getElementById('item-cycle').value = catInfo.defaultCycle;
  }
}

function addItem() {
  const name = document.getElementById('item-name').value.trim();
  if (!name) { showToast('请输入物品名称', 'warning'); return; }
  const category = document.getElementById('item-category').value;
  const catInfo = ITEM_CATEGORIES[category];
  const cycleDays = catInfo.hasCycle ? parseInt(document.getElementById('item-cycle').value) || catInfo.defaultCycle : 0;
  const today = todayStr();
  items.push({
    id: generateId(),
    name: name,
    category: category,
    cycleDays: cycleDays,
    addDate: today,
    resetDate: today
  });
  saveData(userKey(BASE_KEYS.items), items);
  document.getElementById('item-name').value = '';
  renderAll();
  showToast('已添加：' + name, 'success');
}

function resetItemDate(id) {
  const item = items.find(function(i) { return i.id === id; });
  if (item) {
    item.resetDate = todayStr();
    saveData(userKey(BASE_KEYS.items), items);
    renderAll();
    showToast(item.name + ' 倒计时已重置', 'success');
  }
}

function deleteItem(id) {
  items = items.filter(function(i) { return i.id !== id; });
  saveData(userKey(BASE_KEYS.items), items);
  renderAll();
}

function renderItems() {
  const grid = document.getElementById('items-grid');
  if (items.length === 0) {
    grid.innerHTML = '<div class="list-empty">还没有物品，添加一个吧</div>';
    return;
  }
  const today = todayStr();
  let html = '';
  items.forEach(function(item) {
    var cat = item.category || (item.isConsumable ? (item.cycleDays > 0 ? 'periodic' : 'daily') : 'durable');
    var catInfo = ITEM_CATEGORIES[cat];
    let countdownHtml = '';
    let cardClass = 'card';
    if (catInfo.hasCycle && item.cycleDays > 0) {
      const passed = daysBetween(item.resetDate, today);
      const left = item.cycleDays - passed;
      if (left <= 0) {
        cardClass = 'card overdue';
        countdownHtml = '<span class="countdown overdue-text">已过期 ' + Math.abs(left) + ' 天</span>';
      } else if (left <= 3) {
        cardClass = 'card expiring';
        countdownHtml = '<span class="countdown expiring-text">还有 ' + left + ' 天</span>';
      } else {
        countdownHtml = '<span class="countdown">还有 ' + left + ' 天</span>';
      }
    }
    const typeTag = '<span class="tag tag-' + cat + '">' + catInfo.label + '</span>';
    html += '<div class="' + cardClass + '">';
    html += '<div class="card-name">' + escapeHtml(item.name) + '</div>';
    html += '<div class="card-meta">' + typeTag + countdownHtml + '</div>';
    html += '<div class="card-actions">';
    if (catInfo.hasCycle && item.cycleDays > 0) {
      html += '<button class="btn btn-sm" onclick="resetItemDate(\'' + item.id + '\')" title="重置倒计时">';
      html += '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>';
      html += ' 重置</button>';
    }
    html += '<button class="btn btn-sm btn-danger" onclick="deleteItem(\'' + item.id + '\')" title="删除">';
    html += '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>';
    html += '</button>';
    html += '</div>';
    html += '</div>';
  });
  grid.innerHTML = html;
}

// ===== 冰箱管理 =====
function addFridgeItem() {
  const name = document.getElementById('fridge-name').value.trim();
  if (!name) { showToast('请输入食材名称', 'warning'); return; }
  const date = document.getElementById('fridge-date').value || todayStr();
  const shelfLife = parseInt(document.getElementById('fridge-shelflife').value) || 7;
  const qty = parseFloat(document.getElementById('fridge-qty').value) || 1;
  const unit = document.getElementById('fridge-unit').value;

  // 检查是否已有同日期+同名称+同单位的食材，合并数量
  var existing = fridge.find(function(f) {
    return f.name === name && f.purchaseDate === date && f.unit === unit;
  });
  if (existing) {
    existing.quantity = (existing.quantity || 1) + qty;
    existing.shelfLifeDays = shelfLife; // 更新保质期
    saveData(userKey(BASE_KEYS.fridge), fridge);
    showToast(name + ' 已合并数量（共 ' + existing.quantity + ' ' + unit + '）', 'success');
  } else {
    fridge.push({
      id: generateId(),
      name: name,
      purchaseDate: date,
      shelfLifeDays: shelfLife,
      quantity: qty,
      unit: unit
    });
    saveData(userKey(BASE_KEYS.fridge), fridge);
    showToast('已添加：' + name, 'success');
  }
  document.getElementById('fridge-name').value = '';
  document.getElementById('fridge-qty').value = '1';
  document.getElementById('fridge-hint').style.display = 'none';
  renderAll();
}

function deleteFridgeItem(id) {
  fridge = fridge.filter(function(f) { return f.id !== id; });
  saveData(userKey(BASE_KEYS.fridge), fridge);
  renderAll();
}

function renderFridge() {
  const grid = document.getElementById('fridge-grid');
  if (fridge.length === 0) {
    grid.innerHTML = '<div class="list-empty">冰箱空空如也，添加食材吧</div>';
    return;
  }
  const today = todayStr();

  // 按剩余保质期正序排序（最紧急的在前）
  var sorted = fridge.slice().sort(function(a, b) {
    var leftA = a.shelfLifeDays - daysBetween(a.purchaseDate, today);
    var leftB = b.shelfLifeDays - daysBetween(b.purchaseDate, today);
    return leftA - leftB;
  });

  // 检测同名称但不同购买日期的食材（需要"注意区分"）
  var nameDateMap = {};
  fridge.forEach(function(f) {
    if (!nameDateMap[f.name]) nameDateMap[f.name] = new Set();
    nameDateMap[f.name].add(f.purchaseDate);
  });
  var multiDateNames = {};
  for (var n in nameDateMap) {
    if (nameDateMap[n].size > 1) multiDateNames[n] = true;
  }

  // 同名食材中，找出剩余保质期最短的（优先使用）
  var nameMinLeft = {};
  fridge.forEach(function(f) {
    var left = f.shelfLifeDays - daysBetween(f.purchaseDate, today);
    if (!(f.name in nameMinLeft) || left < nameMinLeft[f.name]) {
      nameMinLeft[f.name] = left;
    }
  });

  let html = '';
  sorted.forEach(function(f) {
    const passed = daysBetween(f.purchaseDate, today);
    const left = f.shelfLifeDays - passed;
    let cardClass = 'card';
    let leftHtml = '';
    if (left <= 0) {
      cardClass = 'card overdue';
      leftHtml = '<span class="countdown overdue-text">已过期 ' + Math.abs(left) + ' 天</span>';
    } else if (left <= 2) {
      cardClass = 'card expiring';
      leftHtml = '<span class="countdown expiring-text">还剩 ' + left + ' 天</span>';
    } else {
      leftHtml = '<span class="countdown">还剩 ' + left + ' 天</span>';
    }
    const advice = getStorageAdvice(f.name);
    const zoneClass = advice.zone === '冷冻层' ? 'zone-freeze' :
                      advice.zone === '冷藏层' ? 'zone-cool' :
                      advice.zone === '阴凉处' ? 'zone-shade' : 'zone-room';
    html += '<div class="' + cardClass + '">';
    html += '<div class="card-name">' + escapeHtml(f.name) + '<span class="card-qty">×' + (f.quantity || 1) + ' ' + escapeHtml(f.unit || '个') + '</span></div>';
    html += '<div class="card-meta"><span class="tag tag-neutral">购于 ' + f.purchaseDate + '</span>';
    // 同名不同日期 → 注意区分标签
    if (multiDateNames[f.name]) {
      html += '<span class="tag tag-warning">注意区分</span>';
    }
    // 同名中保质期最短的且剩余≤5天 → 优先使用标签
    if (nameMinLeft[f.name] === left && left > 0 && left <= 5) {
      html += '<span class="tag tag-success">优先使用</span>';
    }
    html += leftHtml + '</div>';
    html += '<div class="storage-advice">';
    html += '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
    html += '<span class="storage-zone ' + zoneClass + '">' + advice.zone + '</span>';
    html += '<span>' + advice.tip + '</span>';
    html += '</div>';
    html += '<div class="card-actions">';
    html += '<button class="btn btn-sm btn-danger" onclick="deleteFridgeItem(\'' + f.id + '\')" title="删除">';
    html += '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>';
    html += ' 删除</button>';
    html += '</div>';
    html += '</div>';
  });
  grid.innerHTML = html;
}

// ===== 日期与转义小工具 =====
function addDaysStr(dateStr, n) {
  var d = new Date(dateStr);
  d.setDate(d.getDate() + n);
  return formatDate(d);
}

// YYYY-MM-DD -> M/D
function mdOf(dateStr) {
  var p = String(dateStr).split('-');
  return parseInt(p[1], 10) + '/' + parseInt(p[2], 10);
}

// 用于内联事件属性中的字符串参数
function jsAttr(str) {
  return String(str).replace(/['"\\]/g, '');
}

// ===== 菜谱基础工具 =====
function getAllRecipes() {
  return RECIPES.concat(customRecipes);
}

function getRecipeByName(name) {
  return getAllRecipes().find(function(r) { return r.name === name; });
}

function isCustomRecipe(name) {
  return customRecipes.some(function(r) { return r.name === name; });
}

function matchRecipe(text, q) {
  return (text || '').toLowerCase().indexOf(q) !== -1;
}

function recipeMatchesQuery(r, q) {
  if (!q) return true;
  if (matchRecipe(r.name, q)) return true;
  if (matchRecipe(r.category, q)) return true;
  return r.ingredients.some(function(i) { return matchRecipe(i, q); });
}

// 冰箱中该食材的最早过期日期（YYYY-MM-DD），没有则返回 null
function getIngredientExpiry(name) {
  var best = null;
  fridge.forEach(function(f) {
    if (f.name !== name) return;
    var exp = addDaysStr(f.purchaseDate, f.shelfLifeDays);
    if (best === null || exp < best) best = exp;
  });
  return best;
}

// 距今天还有几天过期（负数表示已过期）
function expiryDaysLeft(name) {
  var exp = getIngredientExpiry(name);
  if (!exp) return null;
  return daysBetween(todayStr(), exp);
}

// ===== 今日食谱推荐 =====
var RECOMMEND_LIMIT = 20;

function recommendRecipes() {
  var fridgeNames = fridge.map(function(f) { return f.name; });
  return getAllRecipes().map(function(r) {
    var matched = [];
    var missing = [];
    var expiringUsed = [];
    r.ingredients.forEach(function(i) {
      if (fridgeNames.indexOf(i) !== -1) {
        matched.push(i);
        var left = expiryDaysLeft(i);
        // 只把「还没过期但快到期」的算作加分项，已过期的交给冰箱模块提醒
        if (left !== null && left >= 0 && left <= 3) expiringUsed.push({ name: i, days: left });
      } else {
        missing.push(i);
      }
    });
    // 打分：食材匹配度为主，能消耗临期食材的额外加权
    var score = matched.length / r.ingredients.length;
    expiringUsed.forEach(function(e) {
      score += 0.45 - e.days * 0.1;
    });
    return {
      name: r.name,
      category: r.category,
      time: r.time || '',
      ingredients: r.ingredients,
      matched: matched,
      missing: missing,
      expiringUsed: expiringUsed,
      score: score
    };
  }).sort(function(a, b) {
    if (b.score !== a.score) return b.score - a.score;
    return a.missing.length - b.missing.length;
  });
}

function renderRecipes() {
  var grid = document.getElementById('recipe-grid');
  if (!grid) return;
  var recs = recommendRecipes();
  if (recipeSearch) {
    recs = recs.filter(function(r) { return recipeMatchesQuery(r, recipeSearch); });
  }
  recs = recs.slice(0, RECOMMEND_LIMIT);
  if (recs.length === 0) {
    grid.innerHTML = '<div class="list-empty">没有匹配的菜谱' + (recipeSearch ? '，换个关键词试试' : '') + '</div>';
    return;
  }
  var html = '';
  recs.forEach(function(r) {
    var matchRate = Math.round(r.matched.length / r.ingredients.length * 100);
    var useExpiring = r.expiringUsed.length > 0;
    html += '<div class="recipe-card' + (useExpiring ? ' use-expiring' : '') + '" onclick="openRecipeDetail(\'' + jsAttr(r.name) + '\')">';
    html += '<div class="recipe-name">' + escapeHtml(r.name);
    if (useExpiring) {
      var soon = r.expiringUsed.slice().sort(function(a, b) { return a.days - b.days; })[0];
      var label = soon.days === 0 ? escapeHtml(soon.name) + '今天到期' : escapeHtml(soon.name) + '剩' + soon.days + '天';
      html += '<span class="recipe-badge">' + label + '</span>';
    } else if (matchRate === 100) {
      html += '<span class="recipe-badge full">食材齐全</span>';
    }
    html += '</div>';
    html += '<div class="match-rate">食材 ' + r.matched.length + '/' + r.ingredients.length +
            (r.missing.length ? ' · 缺 ' + r.missing.length + ' 样' : '') +
            (r.time ? ' · 约' + escapeHtml(r.time) : '') + '</div>';
    html += '<div class="recipe-ingredients">';
    r.ingredients.forEach(function(ing) {
      if (r.matched.indexOf(ing) !== -1) {
        html += '<span class="ingredient-chip have"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' + escapeHtml(ing) + '</span>';
      } else {
        html += '<span class="ingredient-chip miss"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' + escapeHtml(ing) + '</span>';
      }
    });
    html += '</div>';
    html += '<div class="recipe-card-foot"><span>' + escapeHtml(r.category) + '</span><span class="recipe-view-link">查看做法 ›</span></div>';
    html += '</div>';
  });
  grid.innerHTML = html;
}

function onRecipeSearch(val) {
  recipeSearch = (val || '').trim().toLowerCase();
  renderRecipes();
}

// ===== 菜谱库 =====
var LIB_CATS = ['全部', '家常', '汤羹', '清淡', '凉拌', '主食', '饮品', '我的菜谱'];

function onLibrarySearch(val) {
  librarySearch = (val || '').trim().toLowerCase();
  renderLibrary();
}

function setLibraryCat(cat) {
  libraryCat = cat;
  renderLibrary();
}

function renderLibrary() {
  var filters = document.getElementById('lib-filters');
  var grid = document.getElementById('library-grid');
  var countEl = document.getElementById('lib-count');
  if (!grid) return;

  if (filters) {
    var fh = '';
    LIB_CATS.forEach(function(c) {
      fh += '<button class="lib-chip' + (libraryCat === c ? ' active' : '') + '" onclick="setLibraryCat(\'' + jsAttr(c) + '\')">' + escapeHtml(c) + '</button>';
    });
    filters.innerHTML = fh;
  }

  var all = getAllRecipes();
  var list = all.filter(function(r) {
    if (libraryCat === '我的菜谱') { if (!isCustomRecipe(r.name)) return false; }
    else if (libraryCat !== '全部' && r.category !== libraryCat) return false;
    return recipeMatchesQuery(r, librarySearch);
  });

  if (countEl) {
    countEl.textContent = '共 ' + all.length + ' 道菜谱（内置 ' + RECIPES.length + ' · 自建 ' + customRecipes.length +
                          '）　当前显示 ' + list.length + ' 道';
  }

  if (list.length === 0) {
    grid.innerHTML = '<div class="list-empty">这里还没有菜谱，点右上角「新建菜谱」加一道吧</div>';
    return;
  }

  var fridgeNames = fridge.map(function(f) { return f.name; });
  var html = '';
  list.forEach(function(r) {
    var have = r.ingredients.filter(function(i) { return fridgeNames.indexOf(i) !== -1; });
    var custom = isCustomRecipe(r.name);
    html += '<div class="recipe-card" onclick="openRecipeDetail(\'' + jsAttr(r.name) + '\')">';
    html += '<div class="recipe-name">' + escapeHtml(r.name);
    if (custom) html += '<span class="recipe-badge custom">自建</span>';
    html += '</div>';
    html += '<div class="match-rate">' + escapeHtml(r.category) + (r.time ? ' · 约' + escapeHtml(r.time) : '') +
            ' · 冰箱已有 ' + have.length + '/' + r.ingredients.length + ' 种</div>';
    html += '<div class="recipe-ingredients">';
    r.ingredients.forEach(function(ing) {
      var cls = have.indexOf(ing) !== -1 ? 'have' : '';
      html += '<span class="ingredient-chip ' + cls + '">' + escapeHtml(ing) + '</span>';
    });
    html += '</div>';
    html += '<div class="recipe-card-foot"><span>' + (r.steps ? r.steps.length + ' 步做法' : '暂无做法') +
            '</span><span class="recipe-view-link">查看教程 ›</span></div>';
    html += '</div>';
  });
  grid.innerHTML = html;
}

// ===== 菜谱详情（含教程） =====

  detailRecipe = name;

  html += '<span class="rd-meta">' + escapeHtml(r.category || '') + (r.time ? ' · 约' + escapeHtml(r.time) : '') + '</span>';

  html += '</div>';

  html += '<div class="rd-section-title"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h12"/></svg>所需食材</div>';
  html += '<div class="recipe-ingredients">';
  r.ingredients.forEach(function(ing) {

    var left = has ? expiryDaysLeft(ing) : null;

  });
  html += '</div>';

  html += '<div class="rd-section-title"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>做法步骤</div>';
  if (r.steps && r.steps.length) {
    html += '<ol class="rd-steps">';
    r.steps.forEach(function(s) { html += '<li>' + escapeHtml(s) + '</li>'; });
    html += '</ol>';
  } else {
    html += '<div class="list-empty" style="padding:14px">这道菜还没写做法</div>';
  }

  if (r.tips) {
    html += '<div class="rd-section-title"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/><path d="M9 21h6"/></svg>小贴士</div>';
    html += '<div class="rd-tips">' + escapeHtml(r.tips) + '</div>';
  }

  // 加入本周计划
  html += '<div class="rd-addrow">';
  html += '<div class="form-group"><label class="form-label">安排到</label>';
  html += '<select id="rd-day">';
  WP_DAYS.forEach(function(d, i) {
    var dow = i + 1;
    var sel = dow === (new Date().getDay() || 7) ? ' selected' : '';
    html += '<option value="' + dow + '"' + sel + '>' + d + '（' + mdOf(getWeekDate(dow)) + '）</option>';
  });
  html += '</select></div>';
  html += '<div class="form-group"><label class="form-label">餐次</label>';
  html += '<select id="rd-meal">';
  WP_MEALS.forEach(function(m) { html += '<option value="' + m.key + '">' + m.full + '</option>'; });
  html += '</select></div>';
  html += '<button class="btn btn-primary" onclick="addDetailToPlan()">加入本周食谱</button>';
  html += '</div>';

  document.getElementById('rd-body').innerHTML = html;

  var actions = '';
  if (custom) {
    actions += '<button class="btn btn-danger" onclick="deleteCustomRecipe(\'' + jsAttr(name) + '\')">删除该菜谱</button>';
  }
  actions += '<button class="btn" onclick="closeRecipeDetail()">关闭</button>';
  document.getElementById('rd-actions').innerHTML = actions;

  document.getElementById('recipe-detail-overlay').classList.add('show');
}

function closeRecipeDetail() {
  document.getElementById('recipe-detail-overlay').classList.remove('show');
  detailRecipe = null;
}

function addDetailToPlan() {
  if (!detailRecipe) return;
  var dow = document.getElementById('rd-day').value;
  var meal = document.getElementById('rd-meal').value;
  var name = detailRecipe;
  closeRecipeDetail();
  addWeekRecipe(dow + '-' + meal, name);
}

// ===== 本周食谱设置 =====
var WP_DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
var WP_MEALS = [
  { key: 'breakfast', label: '早', full: '早餐' },
  { key: 'lunch', label: '中', full: '午餐' },
  { key: 'dinner', label: '晚', full: '晚餐' }
];

// 本周周一的日期
function getWeekMonday() {
  var d = new Date();
  var dow = d.getDay() || 7;
  d.setDate(d.getDate() - (dow - 1));
  return formatDate(d);
}

// 第 dow 天（1=周一）的日期字符串
function getWeekDate(dow) {
  return addDaysStr(getWeekMonday(), parseInt(dow, 10) - 1);
}

function slotDate(slot) {
  return getWeekDate(slot.split('-')[0]);
}

function slotLabel(slot) {
  var parts = slot.split('-');
  var day = WP_DAYS[parseInt(parts[0], 10) - 1] || '';
  var meal = WP_MEALS.find(function(m) { return m.key === parts[1]; });
  return day + (meal ? meal.full : '');
}

// 取某餐的菜谱数组（兼容旧的单对象结构）
function getSlotDishes(slot) {
  var v = weekPlan[slot];
  if (!v) return [];
  if (Array.isArray(v)) return v;
  return [v];
}

function refOf(slot, recipeName) {
  return slot + '|' + recipeName;
}

// 检查某道菜在某餐是否有食材会提前过期
function getDishExpiryIssues(slot, dish) {
  var mealDate = slotDate(slot);
  var today = todayStr();
  var issues = [];
  var recipe = getRecipeByName(dish.recipe);
  if (!recipe) return issues;
  // 已经过去的餐次不再提醒
  if (mealDate < today) return issues;
  recipe.ingredients.forEach(function(ing) {
    var exp = getIngredientExpiry(ing);
    if (!exp) return;              // 冰箱里没有，属于「待购买」不算冲突
    if (exp >= mealDate) return;   // 能撑到那天
    issues.push({
      ingredient: ing,
      expiry: exp,
      expired: exp < today,
      daysGap: daysBetween(exp, mealDate)
    });
  });
  return issues;
}

function renderWeekPlan() {
  var wrap = document.getElementById('week-plan');
  if (!wrap) return;
  var titleEl = document.getElementById('week-plan-title');
  if (titleEl) {
    titleEl.textContent = '本周食谱设置（' + mdOf(getWeekMonday()) + ' - ' + mdOf(getWeekDate(7)) + '）';
  }
  var todayDow = (new Date().getDay() || 7);
  var html = '<div class="wp-grid">';
  html += '<div class="wp-row wp-head"><div class="wp-corner"></div>';
  WP_MEALS.forEach(function(m) { html += '<div class="wp-meal-label">' + m.label + '</div>'; });
  html += '</div>';

  WP_DAYS.forEach(function(day, di) {
    var dIndex = di + 1;
    var isToday = dIndex === todayDow;
    html += '<div class="wp-row' + (isToday ? ' wp-today-row' : '') + '">';
    html += '<div class="wp-day' + (isToday ? ' wp-today' : '') + '">' + day +
            '<span style="font-size:10px;color:var(--text-light)">' + mdOf(getWeekDate(dIndex)) + '</span>' +
            (isToday ? '<span class="wp-today-badge">今天</span>' : '') + '</div>';
    WP_MEALS.forEach(function(m) {
      var slot = dIndex + '-' + m.key;
      var dishes = getSlotDishes(slot);
      html += '<div class="wp-cell">';
      var totalMiss = 0;
      dishes.forEach(function(d) {
        var issues = getDishExpiryIssues(slot, d);
        totalMiss += (d.missing || []).length;
        html += '<div class="wp-dish' + (issues.length ? ' wp-dish-warn' : '') + '">';
        html += '<span class="wp-dish-name" onclick="openRecipeDetail(\'' + jsAttr(d.recipe) + '\')" title="查看做法">' +
                (issues.length ? '<span class="wp-warn-dot">!</span>' : '') + escapeHtml(d.recipe) + '</span>';
        html += '<span class="wp-dish-x" onclick="removeWeekRecipe(\'' + slot + '\',\'' + jsAttr(d.recipe) + '\')" title="移除">×</span>';
        html += '</div>';
      });
      if (dishes.length > 0 && totalMiss > 0) {
        html += '<div class="wp-recipe-meta wp-miss">缺 ' + totalMiss + ' 样</div>';
      } else if (dishes.length > 0) {
        html += '<div class="wp-recipe-meta wp-ok">齐全</div>';
      }
      html += '<button class="wp-add-btn" onclick="openRecipePicker(\'' + slot + '\')">＋ ' + (dishes.length ? '加菜' : '添加') + '</button>';
      html += '</div>';
    });
    html += '</div>';
  });
  html += '</div>';
  wrap.innerHTML = html;
  renderExpiryAlerts();
}

// ===== 保质期冲突提醒 =====
function collectExpiryConflicts() {
  var out = [];
  Object.keys(weekPlan).forEach(function(slot) {
    getSlotDishes(slot).forEach(function(dish) {
      var issues = getDishExpiryIssues(slot, dish);
      if (issues.length) {
        issues.sort(function(a, b) { return a.expiry < b.expiry ? -1 : 1; });
        out.push({ slot: slot, recipe: dish.recipe, issues: issues, date: slotDate(slot) });
      }
    });
  });
  out.sort(function(a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  return out;
}

// 该菜最晚能被安排到哪天（受最早过期食材限制），返回 dow 或 null
function suggestEarlierDow(conflict) {
  var earliest = conflict.issues[0].expiry;   // 最早过期日
  var today = todayStr();
  if (earliest < today) return null;          // 已经过期，只能换菜或补货
  var target = null;
  for (var dow = 1; dow <= 7; dow++) {
    var d = getWeekDate(dow);
    if (d < today) continue;
    if (d <= earliest) target = dow;          // 取不晚于过期日的最后一天
  }
  return target;
}

function renderExpiryAlerts() {
  var wrap = document.getElementById('expiry-alert-wrap');
  if (!wrap) return;
  var conflicts = collectExpiryConflicts();
  if (conflicts.length === 0) { wrap.innerHTML = ''; return; }

  var html = '<div class="expiry-alert">';
  html += '<div class="expiry-alert-title">';
  html += '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>';
  html += '保质期冲突 ' + conflicts.length + ' 处 · 食材撑不到做菜那天';
  html += '</div>';

  conflicts.forEach(function(c) {
    var mealName = slotLabel(c.slot);
    var names = c.issues.map(function(i) { return i.ingredient; }).join('、');
    var first = c.issues[0];
    html += '<div class="expiry-alert-item">';
    html += '<div class="ea-text">';
    html += '<strong>' + escapeHtml(mealName) + '（' + mdOf(c.date) + '）</strong> 的「' + escapeHtml(c.recipe) + '」：';
    if (first.expired) {
      html += '<span class="ea-strong">' + escapeHtml(names) + ' 已过期</span>，建议补货或换一道菜。';
    } else {
      html += '<span class="ea-strong">' + escapeHtml(names) + '</span> ' + mdOf(first.expiry) +
              ' 就到期，比这餐早 ' + first.daysGap + ' 天。';
    }
    html += '</div>';
    html += '<div class="ea-actions">';
    var sug = suggestEarlierDow(c);
    if (sug !== null) {
      html += '<button class="btn btn-sm btn-primary" onclick="moveDishEarlier(\'' + c.slot + '\',\'' + jsAttr(c.recipe) + '\',' + sug + ')">提前到' +
              WP_DAYS[sug - 1] + '（' + mdOf(getWeekDate(sug)) + '）</button>';
    }
    html += '<button class="btn btn-sm" onclick="replaceDish(\'' + c.slot + '\',\'' + jsAttr(c.recipe) + '\')">换一道菜</button>';
    html += '<button class="btn btn-sm" onclick="removeWeekRecipe(\'' + c.slot + '\',\'' + jsAttr(c.recipe) + '\')">移除</button>';
    html += '</div>';
    html += '</div>';
  });
  html += '</div>';
  wrap.innerHTML = html;
}

function moveDishEarlier(slot, recipeName, targetDow) {
  var meal = slot.split('-')[1];
  var newSlot = targetDow + '-' + meal;
  if (newSlot === slot) { showToast('已经是最合适的日期了', 'info'); return; }
  removeWeekRecipe(slot, recipeName, true);
  addWeekRecipe(newSlot, recipeName, true);
  showToast('已把「' + recipeName + '」提前到' + slotLabel(newSlot), 'success');
}

function replaceDish(slot, recipeName) {
  removeWeekRecipe(slot, recipeName, true);
  openRecipePicker(slot);
}

// ===== 购买清单联动 =====
function addToShoppingFromRecipe(ing, ref) {
  var item = shopping.find(function(s) { return s.name === ing; });
  if (item) {
    if (!item.recipeRefs) item.recipeRefs = [];
    if (item.recipeRefs.indexOf(ref) === -1) {
      item.recipeRefs.push(ref);
      item.quantity += 1;
    }
  } else {
    shopping.push({ id: generateId(), name: ing, quantity: 1, completed: false, recipeRefs: [ref] });
  }
}

function removeRefFromShopping(missingList, ref) {
  (missingList || []).forEach(function(ing) {
    var item = shopping.find(function(s) { return s.name === ing; });
    if (item && item.recipeRefs && item.recipeRefs.indexOf(ref) !== -1) {
      item.recipeRefs = item.recipeRefs.filter(function(s) { return s !== ref; });
      item.quantity -= 1;
      if (item.quantity <= 0) {
        shopping = shopping.filter(function(s) { return s.id !== item.id; });
      }
    }
  });
}

// ===== 增删本周菜谱 =====
function addWeekRecipe(slot, recipeName, silent) {
  var recipe = getRecipeByName(recipeName);
  if (!recipe) return;
  var dishes = getSlotDishes(slot);
  if (dishes.some(function(d) { return d.recipe === recipeName; })) {
    showToast(slotLabel(slot) + '已经有「' + recipeName + '」了', 'warning');
    return;
  }
  var fridgeNames = fridge.map(function(f) { return f.name; });
  var missing = recipe.ingredients.filter(function(i) { return fridgeNames.indexOf(i) === -1; });
  dishes.push({ recipe: recipeName, missing: missing });
  weekPlan[slot] = dishes;
  saveData(userKey(BASE_KEYS.weekPlan), weekPlan);
  missing.forEach(function(ing) { addToShoppingFromRecipe(ing, refOf(slot, recipeName)); });
  saveData(userKey(BASE_KEYS.shopping), shopping);
  renderAll();
  if (silent) return;
  if (missing.length > 0) {
    showToast(slotLabel(slot) + '已加「' + recipeName + '」，' + missing.length + ' 样缺料进了购买清单', 'success');
  } else {
    showToast(slotLabel(slot) + '已加「' + recipeName + '」，食材齐全', 'success');
  }
}

function removeWeekRecipe(slot, recipeName, silent) {
  var dishes = getSlotDishes(slot);
  var dish = dishes.find(function(d) { return d.recipe === recipeName; });
  if (!dish) return;
  removeRefFromShopping(dish.missing, refOf(slot, recipeName));
  var rest = dishes.filter(function(d) { return d.recipe !== recipeName; });
  if (rest.length) weekPlan[slot] = rest; else delete weekPlan[slot];
  saveData(userKey(BASE_KEYS.weekPlan), weekPlan);
  saveData(userKey(BASE_KEYS.shopping), shopping);
  renderAll();
  if (!silent) showToast('已移除「' + recipeName + '」', 'info');
}

function clearWeekRecipe(slot) {
  getSlotDishes(slot).slice().forEach(function(d) { removeWeekRecipe(slot, d.recipe, true); });
  renderAll();
}

// ===== 菜谱选择器弹窗 =====
function openRecipePicker(slot) {
  pickerSlot = slot;
  pickerSearch = '';
  var box = document.getElementById('picker-search');
  if (box) box.value = '';
  var t = document.getElementById('picker-title-text');
  if (t) t.textContent = '为' + slotLabel(slot) + '选菜';
  renderPickerList();
  document.getElementById('recipe-picker-overlay').classList.add('show');
}
function closeRecipePicker() {
  document.getElementById('recipe-picker-overlay').classList.remove('show');
  pickerSlot = null;
}
function onPickerSearch(val) {
  pickerSearch = (val || '').trim().toLowerCase();
  renderPickerList();
}
function renderPickerList() {
  var list = document.getElementById('picker-list');
  if (!list) return;
  var mealDate = pickerSlot ? slotDate(pickerSlot) : null;
  var chosen = pickerSlot ? getSlotDishes(pickerSlot).map(function(d) { return d.recipe; }) : [];
  var matched = getAllRecipes().filter(function(r) { return recipeMatchesQuery(r, pickerSearch); });
  if (matched.length === 0) {
    list.innerHTML = '<div class="list-empty">没有匹配的菜谱，可点右上角「新建」</div>';
    return;
  }
  var fridgeNames = fridge.map(function(f) { return f.name; });
  var html = '';
  matched.forEach(function(r) {
    var custom = isCustomRecipe(r.name);
    var already = chosen.indexOf(r.name) !== -1;
    // 保质期预警：有食材撑不到这一餐
    var risky = [];
    if (mealDate && mealDate >= todayStr()) {
      r.ingredients.forEach(function(ing) {
        if (fridgeNames.indexOf(ing) === -1) return;
        var exp = getIngredientExpiry(ing);
        if (exp && exp < mealDate) risky.push(ing);
      });
    }
    html += '<div class="picker-item' + (custom ? ' picker-item-custom' : '') + '"' +
            (already ? '' : ' onclick="pickRecipe(\'' + jsAttr(r.name) + '\')"') +
            (already ? ' style="opacity:.5;cursor:default"' : '') + '>';
    html += '<div class="picker-item-main">';
    html += '<span class="picker-item-name">' + escapeHtml(r.name) +
            (custom ? ' <span class="tag tag-warning" style="font-size:11px;padding:1px 6px">自建</span>' : '') +
            (already ? ' <span class="tag" style="font-size:11px;padding:1px 6px">已选</span>' : '') + '</span>';
    html += '<span class="picker-item-cat">' + escapeHtml(r.category || '') + (r.time ? ' · ' + escapeHtml(r.time) : '') + '</span>';
    html += '</div>';
    html += '<div class="picker-item-ing">' + r.ingredients.map(function(i) { return escapeHtml(i); }).join('、') + '</div>';
    if (risky.length) {
      html += '<div class="picker-item-ing" style="color:var(--danger)">⚠ ' + escapeHtml(risky.join('、')) + ' 会在这餐之前过期</div>';
    }
    html += '</div>';
  });
  list.innerHTML = html;
}
function pickRecipe(name) {
  var slot = pickerSlot;
  closeRecipePicker();
  if (slot) addWeekRecipe(slot, name);
}

// ===== 新建菜谱 =====
function openCreateRecipe() {
  document.getElementById('recipe-create-err').style.display = 'none';
  document.getElementById('cr-name').value = '';
  document.getElementById('cr-ingredients').value = '';
  document.getElementById('cr-cat').value = '家常';
  document.getElementById('cr-time').value = '';
  document.getElementById('cr-steps').value = '';
  document.getElementById('cr-tips').value = '';
  document.getElementById('recipe-create-overlay').classList.add('show');
  setTimeout(function() { document.getElementById('cr-name').focus(); }, 50);
}
function closeCreateRecipe() {
  document.getElementById('recipe-create-overlay').classList.remove('show');
}
function submitCreateRecipe() {
  var rawName = document.getElementById('cr-name').value.trim();
  var ingRaw = document.getElementById('cr-ingredients').value.trim();
  var cat = document.getElementById('cr-cat').value;
  var time = document.getElementById('cr-time').value.trim();
  var stepsRaw = document.getElementById('cr-steps').value;
  var tips = document.getElementById('cr-tips').value.trim().replace(/['"\\]/g, '');
  var errBox = document.getElementById('recipe-create-err');
  function fail(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }

  // 去掉引号和反斜杠，避免破坏内联事件属性
  var name = rawName.replace(/['"\\]/g, '').trim();
  if (!name) return fail('请填写菜谱名称');
  if (!ingRaw) return fail('请填写至少一种食材');
  if (getAllRecipes().some(function(r) { return r.name === name; })) return fail('已存在同名菜谱，请换一个名称');

  var ingredients = ingRaw.split(/[,，、\s]+/).map(function(s) { return s.trim(); }).filter(function(s) { return s; });
  var steps = stepsRaw.split(/[\n；;]+/).map(function(s) { return s.trim(); }).filter(function(s) { return s; });

  customRecipes.push({
    name: name,
    category: cat,
    time: time,
    ingredients: ingredients,
    steps: steps,
    tips: tips,
    custom: true
  });
  saveData(userKey(BASE_KEYS.customRecipes), customRecipes);
  closeCreateRecipe();
  renderAll();
  if (document.getElementById('recipe-picker-overlay').classList.contains('show')) renderPickerList();
  showToast('已加入菜谱库：「' + name + '」', 'success');
}
function deleteCustomRecipe(name) {
  if (!isCustomRecipe(name)) return;
  customRecipes = customRecipes.filter(function(r) { return r.name !== name; });
  saveData(userKey(BASE_KEYS.customRecipes), customRecipes);
  // 若已排入本周计划，一并移除并回收购物清单
  Object.keys(weekPlan).forEach(function(slot) {
    var dishes = getSlotDishes(slot);
    var dish = dishes.find(function(d) { return d.recipe === name; });
    if (!dish) return;
    removeRefFromShopping(dish.missing, refOf(slot, name));
    var rest = dishes.filter(function(d) { return d.recipe !== name; });
    if (rest.length) weekPlan[slot] = rest; else delete weekPlan[slot];
  });
  saveData(userKey(BASE_KEYS.weekPlan), weekPlan);
  saveData(userKey(BASE_KEYS.shopping), shopping);
  closeRecipeDetail();
  renderAll();
  if (document.getElementById('recipe-picker-overlay').classList.contains('show')) renderPickerList();
  showToast('已从菜谱库删除：「' + name + '」', 'info');
}

// ===== 购买清单 =====
function addShoppingManual() {
  const name = document.getElementById('shopping-name').value.trim();
  if (!name) { showToast('请输入购买项', 'warning'); return; }
  const qty = parseInt(document.getElementById('shopping-qty').value) || 1;
  const existing = shopping.find(function(s) { return s.name === name; });
  if (existing) {
    existing.quantity += qty;
  } else {
    shopping.push({ id: generateId(), name: name, quantity: qty, completed: false });
  }
  saveData(userKey(BASE_KEYS.shopping), shopping);
  document.getElementById('shopping-name').value = '';
  document.getElementById('shopping-qty').value = '1';
  renderAll();
  showToast('已添加：' + name, 'success');
}

function updateShoppingQty(id, delta) {
  const item = shopping.find(function(s) { return s.id === id; });
  if (item) {
    item.quantity += delta;
    if (item.quantity < 1) item.quantity = 1;
    saveData(userKey(BASE_KEYS.shopping), shopping);
    renderShopping();
    renderTodaySection();
  }
}

function deleteShoppingItem(id) {
  shopping = shopping.filter(function(s) { return s.id !== id; });
  saveData(userKey(BASE_KEYS.shopping), shopping);
  renderAll();
}

function toggleShopping(id) {
  var item = shopping.find(function(s) { return s.id === id; });
  if (item) {
    item.completed = !item.completed;
    saveData(userKey(BASE_KEYS.shopping), shopping);
    renderAll();
  }
}

function confirmClearShopping() {
  if (shopping.length === 0) return;
  showModal('清空购买清单', '确定要清空全部 ' + shopping.length + ' 项购买清单吗？此操作不可撤销。', function() {
    shopping = [];
    saveData(userKey(BASE_KEYS.shopping), shopping);
    renderAll();
    showToast('购买清单已清空', 'success');
  });
}

function renderShopping() {
  const list = document.getElementById('shopping-list');
  const clearBtn = document.getElementById('clear-shopping-btn');
  if (shopping.length === 0) {
    list.innerHTML = '<div class="list-empty">购买清单为空</div>';
    clearBtn.style.display = 'none';
    return;
  }
  clearBtn.style.display = '';
  var sorted = shopping.slice().sort(function(a, b) {
    if (a.completed !== b.completed) return a.completed ? 1 : -1;
    return 0;
  });
  var uncompletedCount = shopping.filter(function(s) { return !s.completed; }).length;
  var html = '';
  if (uncompletedCount > 0 && uncompletedCount < shopping.length) {
    html += '<div class="list-section-label">待购买 (' + uncompletedCount + ')</div>';
  }
  sorted.forEach(function(s) {
    var isDone = s.completed;
    html += '<div class="list-item' + (isDone ? ' completed' : '') + '">';
    html += '<button class="check-btn' + (isDone ? ' checked' : '') + '" onclick="toggleShopping(\'' + s.id + '\')" title="' + (isDone ? '取消完成' : '标记完成') + '">';
    if (isDone) {
      html += '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    }
    html += '</button>';
    html += '<span class="list-text" onclick="toggleShopping(\'' + s.id + '\')">' + escapeHtml(s.name) + '</span>';
    if (s.recipeRefs && s.recipeRefs.length > 0) {
      html += '<span class="shopping-from-recipe" title="来自本周食谱">食谱</span>';
    }
    html += '<div class="list-qty">';
    if (!isDone) {
      html += '<button class="qty-btn" onclick="updateShoppingQty(\'' + s.id + '\', -1)">-</button>';
    }
    html += '<span class="qty-num">' + s.quantity + '</span>';
    if (!isDone) {
      html += '<button class="qty-btn" onclick="updateShoppingQty(\'' + s.id + '\', 1)">+</button>';
    }
    html += '</div>';
    html += '<button class="list-delete" onclick="deleteShoppingItem(\'' + s.id + '\')" title="删除">';
    html += '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>';
    html += '</button>';
    html += '</div>';
  });
  list.innerHTML = html;
}

// ===== 事件待办 =====
function addTodo() {
  const text = document.getElementById('todo-text').value.trim();
  if (!text) { showToast('请输入待办内容', 'warning'); return; }
  const todoDateVal = document.getElementById('todo-date').value || todayStr();
  todos.push({
    id: generateId(),
    text: text,
    completed: false,
    addDate: todayStr(),
    todoDate: todoDateVal
  });
  saveData(userKey(BASE_KEYS.todos), todos);
  document.getElementById('todo-text').value = '';
  renderAll();
  showToast('已添加待办', 'success');
}

function toggleTodo(id) {
  const todo = todos.find(function(t) { return t.id === id; });
  if (todo) {
    todo.completed = !todo.completed;
    saveData(userKey(BASE_KEYS.todos), todos);
    renderAll();
  }
}

function deleteTodo(id) {
  todos = todos.filter(function(t) { return t.id !== id; });
  saveData(userKey(BASE_KEYS.todos), todos);
  renderAll();
}

function renderTodos() {
  const list = document.getElementById('todo-list');
  // 显示顶部过滤提示
  var filtered = todos.slice();
  var isFiltered = false;
  if (selectedDate !== todayStr()) {
    isFiltered = true;
    filtered = filtered.filter(function(t) {
      var td = t.todoDate || t.addDate;
      return td === selectedDate;
    });
  }
  if (filtered.length === 0 && todos.length > 0 && isFiltered) {
    filtered = todos.slice(); // 不匹配时显示全部
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div class="list-empty">暂无待办事项</div>';
    return;
  }
  var html = '';
  if (isFiltered) {
    html += '<div class="list-section-label" style="margin-top:0">' + selectedDate + ' 的待办 (' + filtered.length + ')</div>';
  }
  var sorted = filtered.slice().sort(function(a, b) {
    if (a.completed !== b.completed) return a.completed ? 1 : -1;
    var da = a.todoDate || a.addDate || '';
    var db = b.todoDate || b.addDate || '';
    if (!da && !db) return 0;
    if (!da) return 1;   // 无日期的排到最后
    if (!db) return -1;
    return da.localeCompare(db); // 越近的日期越靠前
  });
  sorted.forEach(function(t) {
    var td = t.todoDate || t.addDate || '';
    html += '<div class="list-item' + (t.completed ? ' completed' : '') + '">';
    html += '<div style="display:flex;flex-direction:column;flex:1;min-width:0">';
    html += '<span class="list-text" onclick="toggleTodo(\'' + t.id + '\')">' + escapeHtml(t.text) + '</span>';
    if (td) {
      html += '<span style="font-size:11px;color:var(--text-light);margin-top:2px">' + td + '</span>';
    }
    html += '</div>';
    if (!t.completed) {
      html += '<button class="btn btn-sm btn-icon" onclick="toggleTodo(\'' + t.id + '\')" title="标记完成" style="color:var(--success)">';
      html += '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
      html += '</button>';
    } else {
      html += '<button class="btn btn-sm btn-icon" onclick="toggleTodo(\'' + t.id + '\')" title="取消完成" style="color:var(--text-secondary)">';
      html += '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>';
      html += '</button>';
    }
    html += '<button class="list-delete" onclick="deleteTodo(\'' + t.id + '\')" title="删除">';
    html += '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>';
    html += '</button>';
    html += '</div>';
  });
  list.innerHTML = html;
}

// ===== 今天要处理 =====
function renderTodaySection() {
  const list = document.getElementById('today-list');
  const today = todayStr();
  let entries = [];

  // 过期/即将过期的物品
  items.forEach(function(item) {
    var cat = item.category || (item.isConsumable ? 'periodic' : 'durable');
    var catInfo = ITEM_CATEGORIES[cat];
    if (catInfo.hasCycle && item.cycleDays > 0) {
      const passed = daysBetween(item.resetDate, today);
      const left = item.cycleDays - passed;
      if (left <= 0) {
        entries.push({
          overdue: true,
          icon: 'alert',
          text: item.name + ' 已过期 ' + Math.abs(left) + ' 天',
          actionLabel: '重置',
          actionFn: function() { resetItemDate(item.id); }
        });
      } else if (left <= 3) {
        entries.push({
          overdue: false,
          icon: 'clock',
          text: item.name + ' 还有 ' + left + ' 天需更换',
          actionLabel: '重置',
          actionFn: function() { resetItemDate(item.id); }
        });
      }
    }
  });

  // 过期/即将过期的食材
  fridge.forEach(function(f) {
    const passed = daysBetween(f.purchaseDate, today);
    const left = f.shelfLifeDays - passed;
    if (left <= 0) {
      entries.push({
        overdue: true,
        icon: 'alert',
        text: f.name + ' 已过期 ' + Math.abs(left) + ' 天',
        actionLabel: '删除',
        actionFn: function() { deleteFridgeItem(f.id); }
      });
    } else if (left <= 2) {
      entries.push({
        overdue: false,
        icon: 'clock',
        text: f.name + ' 还剩 ' + left + ' 天保质期',
        actionLabel: '删除',
        actionFn: function() { deleteFridgeItem(f.id); }
      });
    }
  });

  // 未完成的待办（仅今天）
  todos.forEach(function(t) {
    if (!t.completed && (t.todoDate || t.addDate) === today) {
      entries.push({
        overdue: false,
        icon: 'check',
        text: t.text,
        actionLabel: '完成',
        actionFn: function() { toggleTodo(t.id); }
      });
    }
  });

  // 购买清单提示
  var uncompletedShopping = shopping.filter(function(s) { return !s.completed; });
  if (uncompletedShopping.length > 0) {
    entries.push({
      overdue: false,
      icon: 'bag',
      text: '购买清单还有 ' + uncompletedShopping.length + ' 项待买',
      actionLabel: null,
      actionFn: null
    });
  }

  if (entries.length === 0) {
    list.innerHTML = '<div class="today-empty">今天没有待处理的事项，轻松一下！</div>';
    return;
  }

  let html = '';
  entries.forEach(function(e, idx) {
    html += '<div class="today-item' + (e.overdue ? ' overdue' : '') + '">';
    html += '<span class="today-icon">' + getTodayIcon(e.icon) + '</span>';
    html += '<span class="today-text">' + escapeHtml(e.text) + '</span>';
    if (e.actionLabel) {
      html += '<span class="today-action"><button class="btn btn-sm" onclick="todayAction(' + idx + ')">' + e.actionLabel + '</button></span>';
    }
    html += '</div>';
  });
  list.innerHTML = html;
  // 存储 action 回调
  list._actions = entries.map(function(e) { return e.actionFn; });
}

function todayAction(idx) {
  const list = document.getElementById('today-list');
  if (list._actions && list._actions[idx]) {
    list._actions[idx]();
  }
}

function getTodayIcon(name) {
  const icons = {
    alert: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
    clock: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12l2 2 4-4"/></svg>',
    bag: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 01-8 0"/></svg>'

  return icons[name] || icons.clock;
}

// ===== 数据备份（Excel 格式）=====
// 导出为 .xlsx（真正 Excel 文件，多 sheet）
function exportData() {
  // weekPlan 是对象（slot → 菜谱数组），转为表格行
  const weekPlanRows = Object.keys(weekPlan).map(function(slot) {
    return { slot: slot, dishes: JSON.stringify(weekPlan[slot]) };
  });
  const rows = {
    '物品管理': items,
    '冰箱管理': fridge,
    '事件待办': todos,
    '购买清单': shopping,
    '记账本': finance,
    '本周食谱': weekPlanRows,
    '自定义菜谱': customRecipes
  };
  const wb = buildXlsx(rows, { user: activeUser(), date: new Date().toISOString() });
  const blob = new Blob([wb], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '圆序台_' + activeUser() + '_' + todayStr() + '.xlsx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Excel 备份已下载', 'success');
}

// 导入：优先解析 .xlsx（二进制），其次兼容旧 .json
function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const name = (file.name || '').toLowerCase();
  if (name.endsWith('.xlsx')) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const wb = parseXlsx(new Uint8Array(e.target.result));
        if (!wb || !wb.sheets) { showToast('导入失败：Excel 文件格式错误', 'warning'); return; }
        items = wb.sheets['物品管理'] || [];
        fridge = wb.sheets['冰箱管理'] || [];
        todos = wb.sheets['事件待办'] || [];
        shopping = wb.sheets['购买清单'] || [];
        finance = wb.sheets['记账本'] || [];
        // 本周食谱：dishes 列为 JSON 字符串 → 还原为对象
        const wpRows = wb.sheets['本周食谱'] || [];
        weekPlan = {};
        wpRows.forEach(function(r) {
          if (!r.slot) return;
          try { weekPlan[r.slot] = JSON.parse(r.dishes || '[]'); }
          catch (e) { weekPlan[r.slot] = []; }
        });
        customRecipes = wb.sheets['自定义菜谱'] || [];
        saveUserData();
        renderAll();
        showToast('Excel 数据导入成功', 'success');
      } catch (err) {
        showToast('导入失败：文件无法解析', 'warning');
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    // 兼容旧版 JSON 备份
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if (data.items) { items = data.items; }
        if (data.fridge) { fridge = data.fridge; }
        if (data.todos) { todos = data.todos; }
        if (data.shopping) { shopping = data.shopping; }
        if (data.finance) { finance = data.finance; }
        if (data.customRecipes) { customRecipes = data.customRecipes; }
        if (data.weekPlan) { weekPlan = normalizeWeekPlan(data.weekPlan); }
        saveUserData();
        renderAll();
        showToast('JSON 数据导入成功（已兼容旧版）', 'success');
      } catch (err) {
        showToast('导入失败：文件格式错误', 'warning');
      }
    };
    reader.readAsText(file);
  }
  event.target.value = '';
}

// 周计划格式归一化（兼容一餐一菜/一餐多菜）
function normalizeWeekPlan(p) {
  if (!p || typeof p !== 'object') return {};
  const out = {};
  Object.keys(p).forEach(function(slot) {
    const v = p[slot];
    if (Array.isArray(v)) { out[slot] = v; }
    else if (v && typeof v === 'object') { out[slot] = [v]; }
    else { out[slot] = [{ recipe: String(v), missing: [] }]; }
  });
  return out;
}

// 注册：用户名唯一 + 6 位数字密码

  hideLoginError();
  const username = document.getElementById('reg-username').value.trim();

  const pw2 = document.getElementById('reg-password2').value;
  if (username.length < 2 || username.length > 16) { showLoginError('用户名需 2-16 个字符'); return; }

  const users = getUsers();
  if (users.some(function(u) { return u.username === username; })) { showLoginError('该用户名已被注册，请换一个'); return; }
  // 用户名不可与内置管理员同名

// 当前用户数据迁移（旧版结构兼容）
function migrateUserData() {
  // 旧版「选用食谱」数据迁移到本周食谱（填入今天的早中晚）
  var oldSel = loadData(PREFIX + 'selectedRecipes', []);
  if (oldSel.length && Object.keys(weekPlan).length === 0) {
    var tDow = (new Date().getDay() || 7);
    var fillSlots = [tDow + '-breakfast', tDow + '-lunch', tDow + '-dinner'];
    oldSel.slice(0, 3).forEach(function(name, i) {
      var rec = RECIPES.find(function(r) { return r.name === name; });
      if (!rec) return;
      var fridgeNames = fridge.map(function(f) { return f.name; });
      var miss = rec.ingredients.filter(function(ing) { return fridgeNames.indexOf(ing) === -1; });
      weekPlan[fillSlots[i]] = [{ recipe: name, missing: miss }];
      miss.forEach(function(ing) { addToShoppingFromRecipe(ing, refOf(fillSlots[i], name)); });
    });
    saveUserData();
  }
  // 数据迁移 V2：一餐单菜谱 → 一餐多菜谱
  if (!localStorage.getItem(userKey(BASE_KEYS.planMigrated))) {
    var planChanged = false;
    Object.keys(weekPlan).forEach(function(slot) {
      var v = weekPlan[slot];
      if (v && !Array.isArray(v)) {
        weekPlan[slot] = [v];
        planChanged = true;
        shopping.forEach(function(s) {
          if (!s.recipeRefs) return;
          s.recipeRefs = s.recipeRefs.map(function(ref) {
            return ref === slot ? refOf(slot, v.recipe) : ref;
          });
        });
      }
    });
    if (planChanged) saveUserData();
    localStorage.setItem(userKey(BASE_KEYS.planMigrated), '1');
  }
  // 数据迁移：isConsumable → category
  var needSave = false;
  items.forEach(function(item) {
    if (item.category && item.category !== 'consumable') return;
    if (item.isConsumable === true) {
      item.category = item.cycleDays > 0 ? 'periodic' : 'daily';
    } else if (item.isConsumable === false) {
      item.category = 'durable';
    } else if (!item.category) {
      item.category = 'periodic';
    }
    delete item.isConsumable;
    needSave = true;
  });
  if (needSave) saveUserData();
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ===== 日历 =====
var MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
var WEEKDAYS = ['一','二','三','四','五','六','日'];

function getTodoDates() {
  var dates = {};
  todos.forEach(function(t) {
    var d = t.todoDate || t.addDate || '';
    if (d) dates[d] = true;
  });
  return dates;
}

function renderCalendar() {
  var w = document.getElementById('cal-widget');
  var isNarrow = window.innerWidth <= 768;

  if (isNarrow && !narrowShowMonth) {
    // 窄屏：只显示一周
    renderWeekCalendar(w);
  } else {
    // 宽屏 或 窄屏点击了查看整月：显示完整月份
    renderMonthCalendar(w);
  }
}

function renderWeekCalendar(w) {
  var today = new Date();
  var dow = today.getDay() || 7; // 1=Mon ... 7=Sun
  var monday = new Date(today);
  monday.setDate(today.getDate() - dow + 1);
  var todoDates = getTodoDates();
  var todayS = todayStr();

  var html = '';
  html += '<div class="cal-header">';
  html += '<button class="cal-nav" onclick="changeWeek(-1)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>';
  var wkStart = new Date(weekStart);
  html += '<span class="cal-month" style="font-size:14px">' + formatDateShort(wkStart) + ' - ' + formatDateShort(new Date(wkStart.getTime() + 6*86400000)) + '</span>';
  html += '<button class="cal-nav" onclick="changeWeek(1)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>';
  html += '</div>';
  html += '<div class="cal-weekday">';
  WEEKDAYS.forEach(function(d) { html += '<span>' + d + '</span>'; });
  html += '</div>';
  html += '<div class="cal-week-row">';

  for (var i = 0; i < 7; i++) {
    var d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    var ds = formatDate(d);
    var cls = 'cal-week-day';
    if (ds === todayS) cls += ' today';
    if (ds === selectedDate) cls += ' selected';
    if (todoDates[ds]) cls += ' has-todo';
    html += '<div class="' + cls + '" onclick="selectCalendarDate(\'' + ds + '\')">';
    html += '<span class="cwd-label">' + WEEKDAYS[i] + '</span>';
    html += '<span class="cwd-num">' + d.getDate() + '</span>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="cal-footer-btns">';
  html += '<button class="cal-today-btn" onclick="goToToday()">回到今天</button>';
  html += '<button class="cal-today-btn" onclick="toggleNarrowMonth()" style="color:var(--text-secondary)">查看整月</button>';
  html += '</div>';
  w.innerHTML = html;
}

function renderMonthCalendar(w) {
  var year = calendarYear;
  var month = calendarMonth;
  var firstDay = new Date(year, month, 1);
  var startDow = firstDay.getDay() || 7;
  var totalDays = new Date(year, month + 1, 0).getDate();
  var prevDays = new Date(year, month, 0).getDate();
  var todoDates = getTodoDates();
  var today = todayStr();

  var html = '';
  html += '<div class="cal-header">';
  html += '<button class="cal-nav" onclick="changeMonth(-1)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>';
  html += '<span class="cal-month">' + year + '年 ' + MONTH_NAMES[month] + '</span>';
  html += '<button class="cal-nav" onclick="changeMonth(1)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>';
  html += '</div>';
  html += '<div class="cal-weekday">';
  WEEKDAYS.forEach(function(d) { html += '<span>' + d + '</span>'; });
  html += '</div>';
  html += '<div class="cal-grid">';

  // 上月尾
  for (var p = prevDays - startDow + 2; p <= prevDays; p++) {
    html += '<div class="cal-day other-month">' + p + '</div>';
  }
  // 本月
  for (var d = 1; d <= totalDays; d++) {
    var ds = formatDate(new Date(year, month, d));
    var cls = 'cal-day';
    if (ds === today) cls += ' today';
    if (ds === selectedDate) cls += ' selected';
    if (todoDates[ds]) cls += ' has-todo';
    html += '<div class="' + cls + '" onclick="selectCalendarDate(\'' + ds + '\')">' + d + '</div>';
  }
  // 下月头
  var remaining = 42 - (startDow + totalDays - 1);
  if (remaining < 7) remaining += 7;
  for (var n = 1; n <= remaining; n++) {
    html += '<div class="cal-day other-month">' + n + '</div>';
  }
  html += '</div>';
  html += '<div class="cal-footer-btns">';
  html += '<button class="cal-today-btn" onclick="goToToday()">回到今天</button>';
  if (window.innerWidth <= 768) {
    html += '<button class="cal-today-btn" onclick="toggleNarrowMonth()" style="color:var(--text-secondary)">返回周视图</button>';
  }
  html += '</div>';
  w.innerHTML = html;
}

function changeMonth(dir) {
  calendarMonth += dir;
  if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
  if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
  renderCalendar();
}

function toggleNarrowMonth() {
  narrowShowMonth = !narrowShowMonth;
  renderCalendar();
}

function changeWeek(dir) {
  weekStart.setDate(weekStart.getDate() + dir * 7);
  renderCalendar();
}

function selectCalendarDate(ds) {
  selectedDate = ds;
  calendarMonth = parseInt(ds.split('-')[1]) - 1;
  calendarYear = parseInt(ds.split('-')[0]);
  renderCalendar();
  switchTab('todo');
  renderTodos();
}

function goToToday() {
  var now = new Date();
  calendarMonth = now.getMonth();
  calendarYear = now.getFullYear();
  var dow = now.getDay() || 7;
  weekStart = new Date(now);
  weekStart.setDate(now.getDate() - dow + 1);
  selectedDate = todayStr();
  renderCalendar();
  renderTodos();
}
